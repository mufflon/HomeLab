# Build Zotero's translation-server for linux/amd64 from the commit pinned in
# images/translation-server/UPSTREAM_REF (see that folder's README for why).
name: translation-server image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/translation-server/**
      - .github/workflows/translation-server.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: ref
        run: |
          sha=$(tr -d '[:space:]' < images/translation-server/UPSTREAM_REF)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zotero/translation-server
          ref: ${{ steps.ref.outputs.sha }}
          path: upstream

      - name: Submodules (the Dockerfile clones translators itself)
        working-directory: upstream
        run: git submodule update --init --depth 1 modules/utilities modules/translate modules/zotero-schema

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: upstream
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/translation-server:${{ steps.ref.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
            org.opencontainers.image.description=Zotero translation-server, built for linux/amd64 by mufflon/HomeLab
