# Karakeep (bookmark register) with its Meilisearch index and headless Chrome crawler.
# Based on Karakeep's own kubernetes/ manifests (v0.33.2), pinned and on ZFS volumes.
# Secrets: karakeep (NEXTAUTH_SECRET, MEILI_MASTER_KEY) from scripts/secrets.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - web.yaml
  - meilisearch.yaml
  - chrome.yaml
  - ingress.yaml
# Non-secret settings. A generator gives the ConfigMap a content-hash name, so changing
# karakeep.env and re-applying rolls the web pod automatically (env vars are read at start).
# DISABLE_SIGNUPS=true: the owner's account exists (the first sign-up became admin).
configMapGenerator:
  - name: karakeep
    envs: [karakeep.env]
