apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: karakeep
spec:
  ingressClassName: public
  tls:
    - hosts: [karakeep.home.threadsafe.se]   # no secretName: Traefik's default wildcard certificate
  rules:
    - host: karakeep.home.threadsafe.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: karakeep
                port: {name: http}
