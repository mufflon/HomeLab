apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translation-server
  template:
    metadata:
      labels:
        app: translation-server
    spec:
      containers:
        - name: translation-server
          # Built by .github/workflows/translation-server.yml from the upstream commit in
          # images/translation-server/UPSTREAM_REF (Docker Hub's 2.0.6 is arm64-only).
          # Its entrypoint git-pulls the site translators on every start, so those stay current;
          # it therefore runs as the image's default user with a writable filesystem
          # (internal-only service).
          image: ghcr.io/mufflon/translation-server:3a9d17614896@sha256:bb3e408871cbd7be5d158bf36f6411d5aa1f1c35f136cc939e983b06cf5a732f
          ports:
            - {name: http, containerPort: 1969}
          startupProbe:            # git pull + npm start can take a while
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
