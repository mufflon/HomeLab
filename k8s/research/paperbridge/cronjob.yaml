# Every 15 minutes: one pass over Karakeep, then exit. Idempotent; its state is Karakeep tags,
# the Zotero item's Extra field, and the sync's snapshot on the paperbridge volume. Run it now:
#   kubectl -n research create job paperbridge-now --from=cronjob/paperbridge
# Look first without changing anything: add `args: [--dry-run]` to a copy of the job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperbridge
  annotations:
    homelab/stale-after: 1h   # runs every 15 minutes; the watchdog alerts without a success for this long
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0             # the next run retries anyway
      activeDeadlineSeconds: 840
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 10004
            runAsGroup: 10004
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: paperbridge
              # Built by .github/workflows/paperbridge.yml from services/paperbridge on a v* tag.
              image: ghcr.io/mufflon/paperbridge:0.4.0@sha256:31ff100cd0b1faadd06f47fb9edd198e8cf8e926480333f7a3c6d72b924d4618
              envFrom:
                - configMapRef:
                    name: paperbridge
                - secretRef:
                    name: paperbridge     # KARAKEEP_API_KEY, ZOTERO_USER_ID, ZOTERO_API_KEY, [UNPAYWALL_EMAIL]
                - secretRef:
                    name: zotero-webdav   # WEBDAV_USERNAME, WEBDAV_PASSWORD
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 1Gi}     # PDFs are held in memory, up to 200 MB each
              volumeMounts:
                - {name: state, mountPath: /state}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: paperbridge
