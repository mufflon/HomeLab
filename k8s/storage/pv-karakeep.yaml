# hddpool/k8s/karakeep: Karakeep DATA_DIR (SQLite database + crawled assets). Owned root:root,
# because Karakeep's s6-overlay /init runs as root.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: karakeep
spec:
  capacity:
    storage: 100Gi      # informational for local volumes; the dataset has no quota
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zfs-local
  claimRef:
    namespace: research
    name: karakeep
  local:
    path: /hddpool/k8s/karakeep
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [minisforum]
