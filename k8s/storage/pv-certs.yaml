# hddpool/k8s/certs: lego's ACME account and certificates. Owned 10003:10003, mode 0700.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: certs
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zfs-local
  claimRef:
    namespace: ingress
    name: lego-certs
  local:
    path: /hddpool/k8s/certs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [minisforum]
