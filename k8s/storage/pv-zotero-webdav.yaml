# hddpool/k8s/zotero-webdav: Zotero's attachment files (.zip + .prop under zotero/). Owned 10001:10001.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zotero-webdav
spec:
  capacity:
    storage: 500Gi      # informational for local volumes; the dataset has no quota
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zfs-local
  claimRef:
    namespace: research
    name: zotero-webdav
  local:
    path: /hddpool/k8s/zotero-webdav
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [minisforum]
